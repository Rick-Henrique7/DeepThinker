name: Continuous Integration (Laravel)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend/**'

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar ambiente PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, dom, fileinfo, pdo, pdo_sqlite, sqlite
        coverage: none

    - name: Verificar versão do PHP
      run: php -v

    - name: Instalar Dependências do Composer
      run: composer install --prefer-dist --no-progress --no-interaction

    - name: Configurar Arquivo .env e Gerar Key
      env:
        APP_ENV: testing
        APP_DEBUG: 'false'
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        cp .env.example .env
        touch database/database.sqlite
        php artisan key:generate

    - name: Executar Composer post-autoload scripts
      env:
        APP_ENV: testing
      run: composer run-script post-autoload-dump --no-interaction

    - name: Rodar Migrations no SQLite
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan migrate --force

    - name: Executar Suíte de Testes Automatizados
      env:
        APP_ENV: testing
        APP_DEBUG: 'false'
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: php artisan test
